{% extends "base.html" %}


{% block title %}
    Connexion bibliothécaire
{% endblock %}


{% block content %}

    <h2>Connexion bibliothécaire</h2>

    {% if form.errors %}
        <p>
            Identifiant ou mot de passe incorrect.
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Se connecter
        </button>

    </form>

{% endblock %}
