{% extends "base.html" %}


{% block title %}
    Espace bibliothécaire
{% endblock %}


{% block content %}

    <h2>Espace bibliothécaire</h2>

    <p>
        Nombre de membres :
        {{ nombre_membres }}
    </p>

    <p>
        Nombre de médias :
        {{ nombre_medias }}
    </p>

    <h3>Gestion</h3>

    <ul>
        <li>
            <a href="{% url 'bibliothecaire:liste_membres' %}">
                Gérer les membres
            </a>
        </li>
        <li>
            <a href="{% url 'bibliothecaire:liste_medias' %}">
                Gérer les médias
            </a>
        </li>
        <li>
            <a href="{% url 'bibliothecaire:liste_emprunts' %}">
                Gérer les emprunts
            </a>
        </li>
    </ul>

{% endblock %}
