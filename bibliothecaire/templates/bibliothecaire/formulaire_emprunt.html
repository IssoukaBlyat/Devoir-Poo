{% extends "base.html" %}


{% block title %}
    Créer un emprunt
{% endblock %}


{% block content %}

    <h2>Créer un emprunt</h2>


    {% if erreur %}

        <div class="erreur">
            {{ erreur }}
        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Créer l'emprunt
        </button>

    </form>


    <p>
        <a href="{% url 'bibliothecaire:liste_emprunts' %}">
            Retour aux emprunts
        </a>
    </p>

{% endblock %}
