{% extends "base.html" %}


{% block title %}
    Supprimer un membre
{% endblock %}


{% block content %}

    <h2>Supprimer un membre</h2>

    <p>
        Voulez-vous vraiment supprimer
        <strong>
            {{ membre.prenom }}
            {{ membre.nom }}
        </strong>
        ?
    </p>

{% if erreur %}

    <div class="erreur">
        {{ erreur }}
    </div>

{% endif %}

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="bouton bouton-danger"
        >
            Oui, supprimer
        </button>

    </form>

    <p>
        <a
            href="{% url 'bibliothecaire:liste_membres' %}"
            class="bouton bouton-secondaire"
        >
            Annuler
        </a>
    </p>

{% endblock %}
